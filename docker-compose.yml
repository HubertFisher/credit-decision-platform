services:
  postgres:
    image: postgres:16-alpine
    container_name: credit-decision-postgres
    environment:
      POSTGRES_DB: credit_decision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abc123

    ports:
       - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:

